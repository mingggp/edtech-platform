<!doctype html>
<html lang="th" data-theme="petronas-light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>คอร์ส — Ming Studio (หลังบ้าน)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="brand.css?v=10" />
<link rel="stylesheet" href="admin.css?v=8" />
<link rel="stylesheet" href="admin-content.css?v=6" />
<style>
/* instant subject filter chips */
.subj-chips { display: flex; gap: 6px; flex-wrap: wrap; padding: 4px; border-radius: 12px; background: var(--glass); backdrop-filter: blur(18px) saturate(150%); -webkit-backdrop-filter: blur(18px) saturate(150%); border: 1px solid var(--glass-line-strong); }
.subj-chips button { display: inline-flex; align-items: center; gap: 7px; font-family: "IBM Plex Sans Thai", sans-serif; font-size: 12.5px; font-weight: 600; color: var(--fg-2); background: transparent; border: 0; padding: 8px 13px; border-radius: 9px; cursor: pointer; transition: color .15s, background .15s, transform .15s; }
.subj-chips button .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.subj-chips button:hover { color: var(--fg-0); background: var(--bg-2); }
.subj-chips button:active { transform: scale(0.95); }
.subj-chips button[aria-pressed="true"] { color: #fff; background: var(--grad-signature); box-shadow: 0 4px 12px -4px oklch(0.66 0.23 295 / 0.5); }
.subj-chips button[aria-pressed="true"] .dot { box-shadow: 0 0 0 2px oklch(0.99 0.005 285 / 0.4); }

/* grade-level checkbox filter */
.grade-checks { display: flex; align-items: center; gap: 4px; padding: 4px 6px; border-radius: 12px; background: var(--glass); backdrop-filter: blur(18px) saturate(150%); -webkit-backdrop-filter: blur(18px) saturate(150%); border: 1px solid var(--glass-line-strong); }
.grade-checks .gc-lab { font-family: "JetBrains Mono"; font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg-3); padding: 0 6px; }
.grade-checks label { position: relative; cursor: pointer; }
.grade-checks input { position: absolute; opacity: 0; pointer-events: none; }
.grade-checks label span { display: inline-flex; align-items: center; gap: 6px; font-family: "IBM Plex Sans Thai", sans-serif; font-size: 12.5px; font-weight: 600; color: var(--fg-2); padding: 8px 12px; border-radius: 9px; transition: color .15s, background .15s, box-shadow .15s; }
.grade-checks label span::before { content: ""; width: 14px; height: 14px; border-radius: 4.5px; border: 1.5px solid var(--fg-3); background: transparent; transition: background .15s, border-color .15s, box-shadow .15s; flex-shrink: 0; }
.grade-checks label:hover span { color: var(--fg-0); background: var(--bg-2); }
.grade-checks input:checked + span { color: var(--fg-0); }
.grade-checks input:checked + span::before { background: var(--grad-signature); border-color: transparent; box-shadow: 0 2px 8px -2px oklch(0.66 0.23 295 / 0.6); background-size: cover; }
.grade-checks input:checked + span { background: oklch(0.66 0.23 295 / 0.10); }
.grade-checks input:focus-visible + span { outline: 2px solid var(--brand-magenta); outline-offset: 2px; }
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<div class="noise" aria-hidden="true"></div>
<div class="adm" id="adm" data-screen-label="Admin · คอร์ส">

  <aside class="adm-sb" id="adm-sb"></aside>

  <div class="adm-main">
    <header class="adm-top">
      <nav class="adm-crumb"><a href="Admin Overview.html">หลังบ้าน</a><span class="sep">/</span><b>คอร์ส</b></nav>
      <div class="adm-top-actions">
        <button class="adm-search" id="cmdk"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><span class="lbl">ค้นหา · คำสั่ง</span><span class="kbd">⌘K</span></button>
        <div class="tt" role="group" aria-label="ธีม">
          <button data-set="light" aria-pressed="false" id="btn-light" aria-label="สว่าง"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
          <button data-set="dark" aria-pressed="true" id="btn-dark" aria-label="มืด"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg></button>
        </div>
        <a class="adm-ico" href="Courses.html" target="_blank" aria-label="ดูหน้าคอร์สจริง"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6M10 14 21 3"/></svg></a>
      </div>
    </header>

    <div class="adm-scroll">
      <div class="adm-page">

        <section class="adm-head reveal">
          <div class="titles">
            <div class="eyebrow">CONTENT STUDIO · คอร์ส</div>
            <h1>คอร์ส<span class="grad">เรียน</span></h1>
            <div class="sub">จัดการคอร์สทั้งหมด · สลับเผยแพร่/ร่างได้ทันที · กดการ์ดเพื่อแก้เนื้อหา</div>
          </div>
          <div class="adm-head-actions">
            <a class="btn btn-primary btn-sm" href="Admin Course Editor.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>สร้างคอร์สใหม่</a>
          </div>
        </section>

        <section class="sum-strip reveal" data-delay="1">
          <div class="sum"><div class="sl"><span class="di" style="background:var(--success)"></span>เผยแพร่อยู่</div><div class="sv">5<span class="unit">คอร์ส</span></div></div>
          <div class="sum"><div class="sl"><span class="di" style="background:var(--fg-3)"></span>ฉบับร่าง</div><div class="sv">1<span class="unit">คอร์ส</span></div></div>
          <div class="sum"><div class="sl"><span class="di" style="background:var(--brand-cyan)"></span>นักเรียนรวม</div><div class="sv">1,121<span class="unit">คน</span></div></div>
          <div class="sum"><div class="sl"><span class="di" style="background:var(--brand-violet)"></span>รายได้รวมคอร์ส</div><div class="sv"><span class="cur">฿</span>1.96M</div></div>
        </section>

        <section class="adm-toolbar reveal" data-delay="2">
          <div class="tb-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input type="text" id="search" placeholder="ค้นหาคอร์ส..." /></div>
          <div class="subj-chips" id="f-subject" role="group" aria-label="กรองวิชา">
            <button data-v="all" aria-pressed="true">ทั้งหมด</button>
            <button data-v="คณิต" aria-pressed="false"><span class="dot" style="background:var(--subj-math)"></span>คณิต</button>
            <button data-v="ฟิสิกส์" aria-pressed="false"><span class="dot" style="background:var(--subj-phys)"></span>ฟิสิกส์</button>
            <button data-v="TPAT3" aria-pressed="false"><span class="dot" style="background:var(--subj-tpat)"></span>TPAT3</button>
            <button data-v="TGAT2" aria-pressed="false"><span class="dot" style="background:var(--subj-tgat)"></span>TGAT2</button>
          </div>
          <div class="grade-checks" id="f-grade" role="group" aria-label="กรองระดับชั้น">
            <span class="gc-lab">ระดับชั้น</span>
            <label><input type="checkbox" value="ม.4" /><span>ม.4</span></label>
            <label><input type="checkbox" value="ม.5" /><span>ม.5</span></label>
            <label><input type="checkbox" value="ม.6" /><span>ม.6</span></label>
            <label><input type="checkbox" value="A-Level" /><span>A-Level</span></label>
          </div>
          <select class="tb-select" id="f-status">
            <option value="all">ทุกสถานะ</option>
            <option value="published">เผยแพร่</option>
            <option value="draft">ฉบับร่าง</option>
          </select>
          <div class="grow"></div>
          <div class="view-toggle" id="view-toggle" role="group" aria-label="มุมมอง">
            <button data-v="grid" aria-pressed="true" aria-label="การ์ด"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></button>
            <button data-v="list" aria-pressed="false" aria-label="รายการ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></button>
          </div>
        </section>

        <section class="course-grid reveal" id="grid" data-delay="3"></section>
        <div id="no-result" style="display:none"></div>

      </div>
    </div>
  </div>
</div>

<div class="tweaks" id="tweaks">
  <div class="tweaks-head" id="tweaks-drag"><b>Tweaks</b><button class="x" id="tweaks-close" aria-label="ปิด">✕</button></div>
  <div class="tweak-grp"><div class="gl">Accent</div>
    <div class="tweak-sw" data-tweak="accent">
      <button data-v="signature" aria-pressed="true" style="background:linear-gradient(115deg,oklch(0.66 0.23 295),oklch(0.68 0.25 5),oklch(0.78 0.20 50))" aria-label="Signature"></button>
      <button data-v="cool" aria-pressed="false" style="background:linear-gradient(115deg,oklch(0.66 0.23 295),oklch(0.80 0.16 205))" aria-label="Cool"></button>
      <button data-v="warm" aria-pressed="false" style="background:linear-gradient(115deg,oklch(0.68 0.25 5),oklch(0.86 0.20 130))" aria-label="Warm"></button>
    </div>
  </div>
  <div class="tweak-grp"><div class="gl">ความหนาแน่น</div>
    <div class="tweak-seg" data-tweak="density"><button data-v="comfortable" aria-pressed="true">สบายตา</button><button data-v="compact" aria-pressed="false">กระชับ</button></div>
  </div>
  <div class="tweak-grp"><div class="gl">มุมมองเริ่มต้น</div>
    <div class="tweak-seg" data-tweak="defaultview"><button data-v="grid" aria-pressed="true">การ์ด</button><button data-v="list" aria-pressed="false">รายการ</button></div>
  </div>
  <div class="tweak-grp"><div class="gl">Demo · สถานะหน้า</div>
    <div class="tweak-seg" data-tweak="view"><button data-v="data" aria-pressed="true">มีข้อมูล</button><button data-v="empty" aria-pressed="false">ว่างเปล่า</button></div>
  </div>
</div>

<script>window.__TWEAKS_DEFAULTS = { accent:'signature', density:'comfortable', defaultview:'grid', view:'data' };</script>
<script src="admin-shell.js?v=3"></script>
<script src="admin-common.js?v=5"></script>
<script src="admin-courses.js?v=5"></script>
</body>
</html>
