<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>Audit Logs — Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style> 
    body { font-family: 'Prompt', sans-serif; }
    .diff-added { background-color: #dcfce7; color: #166534; }
    .diff-removed { background-color: #fee2e2; color: #991b1b; text-decoration: line-through; }
    .diff-modified { background-color: #fef9c3; color: #854d0e; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800">

  <div class="flex min-h-screen">
    <aside class="w-64 bg-slate-900 text-white flex flex-col fixed h-full z-20 shadow-2xl transition-all duration-300">
      <div class="h-16 flex items-center justify-center border-b border-slate-800 text-xl font-bold tracking-wider">
        <span class="text-indigo-400 mr-2 text-2xl">✦</span> Admin Panel
      </div>
      
      <nav class="flex-1 p-4 space-y-2 overflow-y-auto custom-scroll">
        <a href="./admin_dashboard.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-slate-800 hover:text-white hover:translate-x-1 transition-all duration-200">
            <span class="text-xl">📊</span> <span>Dashboard</span>
        </a>
        <a href="./admin_users.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-slate-800 hover:text-white hover:translate-x-1 transition-all duration-200">
            <span class="text-xl">👥</span> <span>Users</span>
        </a>
        <a href="./admin_courses.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-slate-800 hover:text-white hover:translate-x-1 transition-all duration-200">
            <span class="text-xl">📚</span> <span>Courses</span>
        </a>
        <a href="./admin_exams.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-slate-800 hover:text-white hover:translate-x-1 transition-all duration-200">
            <span class="text-xl">📝</span> <span>Exams</span>
        </a>
        <a href="./admin_payments.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-slate-800 hover:text-white hover:translate-x-1 transition-all duration-200">
            <span class="text-xl">💰</span> <span>Payments</span>
        </a>
        <a href="./admin_coupons.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-slate-800 hover:text-white hover:translate-x-1 transition-all duration-200">
            <span class="text-xl">🎟️</span> <span>Coupons</span>
        </a>
        <a href="./admin_reports.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-slate-800 hover:text-white hover:translate-x-1 transition-all duration-200">
            <span class="text-xl">🚩</span> <span>Reports</span>
        </a>

        <div class="border-t border-slate-800 my-2 pt-2">
            <p class="px-4 text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1">System</p>
            <a href="./admin_audit.html" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-indigo-600 text-white shadow-lg font-bold transition-all duration-200 transform translate-x-1">
                <span class="text-xl">🛡️</span> <span>Audit Log</span>
            </a>
            <a href="./admin_settings.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-slate-800 hover:text-white hover:translate-x-1 transition-all duration-200">
                <span class="text-xl">⚙️</span> <span>Settings</span>
            </a>
        </div>
      </nav>

      <div class="p-4 border-t border-slate-800">
        <button onclick="localStorage.removeItem('token');location.href='./login.html'" class="w-full py-3 bg-slate-800 hover:bg-red-600/90 text-slate-300 hover:text-white rounded-xl transition-all duration-200 font-bold flex items-center justify-center gap-2 group">
            <span>🚪</span> <span class="group-hover:translate-x-1 transition-transform">Logout</span>
        </button>
      </div>
    </aside>

    <main class="flex-1 ml-64 p-8">
      <h1 class="text-3xl font-bold text-slate-800 mb-6">บันทึกกิจกรรม (Audit Logs)</h1>
      <div class="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
        <table class="w-full text-left">
            <thead class="bg-slate-50 border-b border-slate-100 text-xs font-bold text-slate-500 uppercase">
                <tr><th class="p-5">Time</th><th class="p-5">Action</th><th class="p-5">Actor</th><th class="p-5">Target</th><th class="p-5 text-right">Details</th></tr>
            </thead>
            <tbody id="logTable" class="text-sm divide-y divide-slate-100"></tbody>
        </table>
      </div>
    </main>
  </div>

  <dialog id="diffModal" class="p-0 rounded-2xl shadow-2xl backdrop:bg-slate-900/50 w-[600px]">
      <div class="bg-white p-6 rounded-2xl">
          <h3 class="font-bold text-xl mb-4">การเปลี่ยนแปลงข้อมูล</h3>
          <div id="diffContent" class="space-y-2 font-mono text-sm bg-slate-50 p-4 rounded-xl border border-slate-200 h-96 overflow-y-auto"></div>
          <div class="flex justify-end mt-4"><button onclick="document.getElementById('diffModal').close()" class="px-6 py-2 bg-slate-800 text-white rounded-lg font-bold">ปิด</button></div>
      </div>
  </dialog>

  <script>
    const API = (location.hostname === "localhost" || location.hostname === "127.0.0.1") 
    ? "http://127.0.0.1:8000" 
    : "https://edtech-api-zigm.onrender.com"; // <-- ใส่ลิงก์ Render ของคุณตรงนี้
    const token = localStorage.getItem("token");

    async function loadLogs() {
        const res = await fetch(`${API}/admin/audit`, { headers: { Authorization: `Bearer ${token}` } });
        const data = await res.json();
        document.getElementById("logTable").innerHTML = data.items.map(l => `
            <tr class="hover:bg-slate-50 transition">
                <td class="p-5 text-slate-500">${l.created_at_bkk}</td>
                <td class="p-5 font-bold text-indigo-600">${l.action}</td>
                <td class="p-5">User #${l.actor_id || '?'}</td>
                <td class="p-5">ID: ${l.target_id || '-'}</td>
                <td class="p-5 text-right"><button onclick='showDiff(${JSON.stringify(l.diff).replace(/'/g, "&#39;")})' class="px-3 py-1 bg-white border border-slate-200 rounded-lg text-slate-600 font-bold hover:border-indigo-300 hover:text-indigo-600 transition shadow-sm text-xs">🔍 ดูความเปลี่ยนแปลง</button></td>
            </tr>
        `).join("");
    }

    function showDiff(diffs) {
        const el = document.getElementById("diffContent");
        if(diffs.length === 0) el.innerHTML = `<div class="text-center text-slate-400">ไม่มีข้อมูลการเปลี่ยนแปลง หรือเป็นการสร้างใหม่</div>`;
        else el.innerHTML = diffs.map(d => `
            <div class="p-2 rounded border border-slate-200 bg-white mb-2">
                <div class="font-bold text-slate-700 mb-1">${d.field}</div>
                <div class="grid grid-cols-2 gap-2 text-xs">
                    <div class="p-1 bg-red-50 text-red-700 rounded border border-red-100">Old: ${d.before}</div>
                    <div class="p-1 bg-emerald-50 text-emerald-700 rounded border border-emerald-100">New: ${d.after}</div>
                </div>
            </div>
        `).join("");
        document.getElementById("diffModal").showModal();
    }
    loadLogs();
  </script>
</body>
</html>
