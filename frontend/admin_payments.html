<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ตรวจสอบการชำระเงิน — Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style> body { font-family: 'Prompt', sans-serif; } </style>
</head>
<body class="bg-slate-50 text-slate-800">

  <div class="flex min-h-screen">
    <aside class="w-64 bg-slate-900 text-white flex flex-col fixed h-full z-20 shadow-2xl transition-all duration-300">
      <div class="h-16 flex items-center justify-center border-b border-slate-800 text-xl font-bold tracking-wider">
        <span class="text-indigo-400 mr-2 text-2xl">✦</span> Admin Panel
      </div>
      
      <nav class="flex-1 p-4 space-y-2 overflow-y-auto custom-scroll">
        <a href="./admin_dashboard.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-slate-800 hover:text-white hover:translate-x-1 transition-all duration-200">
            <span class="text-xl">📊</span> <span>Dashboard</span>
        </a>
        <a href="./admin_users.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-slate-800 hover:text-white hover:translate-x-1 transition-all duration-200">
            <span class="text-xl">👥</span> <span>Users</span>
        </a>
        <a href="./admin_courses.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-slate-800 hover:text-white hover:translate-x-1 transition-all duration-200">
            <span class="text-xl">📚</span> <span>Courses</span>
        </a>
        <a href="./admin_exams.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-slate-800 hover:text-white hover:translate-x-1 transition-all duration-200">
            <span class="text-xl">📝</span> <span>Exams</span>
        </a>
        <a href="./admin_payments.html" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-indigo-600 text-white shadow-lg font-bold transition-all duration-200 transform translate-x-1">
            <span class="text-xl">💰</span> <span>Payments</span>
        </a>
        <a href="./admin_coupons.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-slate-800 hover:text-white hover:translate-x-1 transition-all duration-200">
            <span class="text-xl">🎟️</span> <span>Coupons</span>
        </a>
        <a href="./admin_reports.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-slate-800 hover:text-white hover:translate-x-1 transition-all duration-200">
            <span class="text-xl">🚩</span> <span>Reports</span>
        </a>

        <div class="border-t border-slate-800 my-2 pt-2">
            <p class="px-4 text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1">System</p>
            <a href="./admin_audit.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-slate-800 hover:text-white hover:translate-x-1 transition-all duration-200">
                <span class="text-xl">🛡️</span> <span>Audit Log</span>
            </a>
            <a href="./admin_settings.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-slate-800 hover:text-white hover:translate-x-1 transition-all duration-200">
                <span class="text-xl">⚙️</span> <span>Settings</span>
            </a>
        </div>
      </nav>

      <div class="p-4 border-t border-slate-800">
        <button onclick="localStorage.removeItem('token');location.href='./login.html'" class="w-full py-3 bg-slate-800 hover:bg-red-600/90 text-slate-300 hover:text-white rounded-xl transition-all duration-200 font-bold flex items-center justify-center gap-2 group">
            <span>🚪</span> <span class="group-hover:translate-x-1 transition-transform">Logout</span>
        </button>
      </div>
    </aside>

    <main class="flex-1 ml-64 p-8">
      <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold">รายการแจ้งโอนเงิน</h1>
        <select id="statusFilter" onchange="loadPayments()" class="border p-2 rounded-lg text-sm bg-white">
            <option value="">ทั้งหมด</option>
            <option value="pending" selected>รอตรวจสอบ</option>
            <option value="approved">อนุมัติแล้ว</option>
            <option value="rejected">ปฏิเสธ</option>
        </select>
      </div>

      <div class="bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden">
        <table class="w-full text-left border-collapse">
            <thead class="bg-slate-50 text-slate-500 text-xs uppercase">
                <tr>
                    <th class="p-4">ID</th>
                    <th class="p-4">User ID</th>
                    <th class="p-4">Course ID</th>
                    <th class="p-4">จำนวนเงิน</th>
                    <th class="p-4">สลิป</th>
                    <th class="p-4">สถานะ</th>
                    <th class="p-4 text-center">จัดการ</th>
                </tr>
            </thead>
            <tbody id="paymentTable" class="text-sm divide-y divide-slate-100"></tbody>
        </table>
      </div>
    </main>
  </div>

  <script>
    const API = (location.hostname === "localhost" || location.hostname === "127.0.0.1") 
    ? "http://127.0.0.1:8000" 
    : "https://edtech-api-zigm.onrender.com"; // <-- ใส่ลิงก์ Render ของคุณตรงนี้
    const token = localStorage.getItem("token");
    if(!token) location.href = "./login.html";
    function logout() { localStorage.removeItem("token"); location.href = "./login.html"; }

    async function loadPayments() {
        const status = document.getElementById("statusFilter").value;
        const url = `${API}/admin/payments${status ? '?status='+status : ''}`;
        
        try {
            const res = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
            const data = await res.json();
            const tbody = document.getElementById("paymentTable");
            
            if(data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="p-6 text-center text-slate-400">ไม่มีรายการ</td></tr>`;
                return;
            }

            tbody.innerHTML = data.map(p => `
                <tr class="hover:bg-slate-50 transition">
                    <td class="p-4 text-slate-400">#${p.id}</td>
                    <td class="p-4">${p.user_id || '-'}</td>
                    <td class="p-4">${p.course_id || '-'}</td>
                    <td class="p-4 font-bold">฿${p.amount.toLocaleString()}</td>
                    <td class="p-4"><a href="${p.slip_url ? (p.slip_url.startsWith('http')?p.slip_url:API+p.slip_url) : '#'}" target="_blank" class="text-indigo-600 hover:underline">ดูสลิป</a></td>
                    <td class="p-4">
                        <span class="px-2 py-1 rounded text-xs font-bold 
                            ${p.status==='approved'?'bg-emerald-100 text-emerald-700': p.status==='rejected'?'bg-red-100 text-red-700':'bg-amber-100 text-amber-700'}">
                            ${p.status}
                        </span>
                    </td>
                    <td class="p-4 text-center space-x-1">
                        ${p.status === 'pending' ? `
                            <button onclick="processPayment(${p.id}, 'approve')" class="px-3 py-1 bg-emerald-500 text-white rounded text-xs hover:bg-emerald-600">อนุมัติ</button>
                            <button onclick="processPayment(${p.id}, 'reject')" class="px-3 py-1 bg-red-500 text-white rounded text-xs hover:bg-red-600">ปฏิเสธ</button>
                        ` : '-'}
                    </td>
                </tr>
            `).join("");
        } catch(e) { console.error(e); }
    }

    async function processPayment(id, action) {
        if(!confirm(`ยืนยันการ ${action === 'approve' ? 'อนุมัติ' : 'ปฏิเสธ'}?`)) return;
        await fetch(`${API}/admin/payments/${id}/${action}`, {
            method: "POST",
            headers: { Authorization: `Bearer ${token}` }
        });
        loadPayments();
    }

    loadPayments();
  </script>
</body>
</html>
