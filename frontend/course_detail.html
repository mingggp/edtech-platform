<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>รายละเอียดคอร์ส</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style> 
    body { font-family: 'Prompt', sans-serif; background-color: #f8fafc; } 
    .glass-panel { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid #e2e8f0; }
    /* Fix SwAl z-index just in case */
    .swal2-container { z-index: 2147483647 !important; }
  </style>
</head>
<body class="min-h-screen text-slate-800 pb-20">

  <nav class="fixed top-0 w-full z-50 bg-white/80 backdrop-blur-md border-b border-slate-200 h-16 flex items-center justify-between px-6">
      <div class="font-bold text-xl text-indigo-600">MingSmileyFace</div>
      <div class="flex gap-1">
          <a href="./me.html" class="px-4 py-1.5 text-sm font-bold text-slate-500 hover:text-indigo-600">Dashboard</a>
          <a href="./course.html" class="px-4 py-1.5 text-sm font-bold text-indigo-600 bg-indigo-50 rounded-full">คอร์สเรียน</a>
      </div>
      <div class="w-5"></div>
  </nav>

  <div class="pt-24 max-w-6xl mx-auto px-4">
    <div id="loading" class="text-center py-20 text-slate-400">กำลังโหลดข้อมูลคอร์ส...</div>

    <div id="courseContent" class="hidden grid grid-cols-1 lg:grid-cols-3 gap-10">
        <div class="lg:col-span-1 space-y-6">
            <div class="rounded-3xl overflow-hidden shadow-2xl border-4 border-white">
                <img id="cImage" src="" class="w-full object-cover aspect-[4/3] bg-slate-200">
            </div>
            <div class="glass-panel p-6 rounded-3xl shadow-sm space-y-4">
                <div class="flex justify-between items-center pb-4 border-b border-slate-100">
                    <span class="text-slate-500 text-sm font-bold">ราคา</span>
                    <span id="cPrice" class="text-3xl font-black text-indigo-600">฿0</span>
                </div>
                
                <div class="space-y-3 text-sm text-slate-600">
                     <div class="flex justify-between items-center bg-slate-50 p-2 rounded-lg">
                         <span class="font-bold">📂 หมวดหมู่</span>
                         <span id="cCategory" class="text-indigo-500 font-bold">-</span>
                     </div>
                     <div class="flex justify-between items-center bg-slate-50 p-2 rounded-lg">
                         <span class="font-bold">🎬 บทเรียน</span>
                         <span id="cLessonCount" class="font-bold">-</span>
                     </div>
                     <div class="flex justify-between items-center bg-slate-50 p-2 rounded-lg">
                         <span class="font-bold">⏱️ เวลาเรียน</span>
                         <span id="cDuration" class="font-bold">- นาที</span>
                     </div>
                </div>

                <button onclick="openPaymentModal()" class="w-full py-3.5 bg-slate-900 text-white font-bold rounded-xl hover:bg-indigo-600 transition shadow-lg flex items-center justify-center gap-2">
                    <span>สมัครเรียน</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6" /></svg>
                </button>
            </div>
        </div>

        <div class="lg:col-span-2 space-y-8">
            <div>
                <h1 id="cTitle" class="text-4xl font-black text-slate-900 mb-4 leading-tight">-</h1>
                <p id="cDesc" class="text-lg text-slate-600 font-light leading-relaxed">-</p>
            </div>

            <div id="highlightsArea" class="hidden">
                <h3 class="font-bold text-xl mb-4 flex items-center gap-2"><span class="text-amber-500">✨</span> จุดเด่นของคอร์ส</h3>
                <div id="cHighlights" class="bg-amber-50/50 p-5 rounded-2xl border border-amber-100 text-slate-700 leading-relaxed"></div>
            </div>

            <div id="targetArea" class="hidden">
                <h3 class="font-bold text-xl mb-4 flex items-center gap-2"><span class="text-emerald-500">🎯</span> เหมาะกับใคร</h3>
                <div id="cTarget" class="bg-emerald-50/50 p-5 rounded-2xl border border-emerald-100 text-slate-700 leading-relaxed"></div>
            </div>

            <div>
                <h3 class="font-bold text-xl mb-4 flex items-center gap-2"><span class="text-indigo-500">📚</span> เนื้อหาบทเรียน</h3>
                <div id="chapterList" class="space-y-3"></div>
            </div>
        </div>
    </div>
  </div>

  <dialog id="payModal" class="p-0 rounded-2xl shadow-2xl backdrop:bg-slate-900/60 w-full max-w-lg">
      <div class="bg-white">
          <div class="px-6 py-4 border-b flex justify-between items-center bg-slate-50">
              <h3 class="font-bold text-lg flex items-center gap-2 text-slate-800">
                  <svg class="w-5 h-5 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
                  ชำระเงินค่าคอร์ส
              </h3>
              <button onclick="document.getElementById('payModal').close()" class="text-slate-400 hover:text-red-500 text-2xl font-bold">&times;</button>
          </div>

          <div class="p-6 space-y-6">
              <div class="space-y-2">
                  <div class="flex justify-between text-slate-600"><span>ราคาคอร์ส</span> <span class="font-medium" id="payOriginalPrice">฿0</span></div>
                  <div class="flex justify-between text-emerald-600 hidden" id="payDiscountRow"><span>ส่วนลด (<span id="couponName"></span>)</span> <span class="font-medium" id="payDiscountVal">-฿0</span></div>
                  <div class="flex justify-between items-center pt-2 border-t border-slate-200">
                      <span class="font-bold text-slate-800">ยอดชำระสุทธิ</span>
                      <span class="text-2xl font-black text-indigo-600" id="payFinalPrice">฿0</span>
                  </div>
              </div>

              <div class="flex gap-2">
                  <input type="text" id="couponInput" placeholder="กรอกโค้ดส่วนลด (ถ้ามี)" class="flex-1 border border-slate-300 rounded-lg px-3 py-2 text-sm uppercase outline-none focus:ring-2 focus:ring-indigo-500">
                  <button onclick="applyCoupon()" class="bg-slate-800 text-white px-4 py-2 rounded-lg text-sm font-bold hover:bg-slate-700 transition">ใช้โค้ด</button>
              </div>

              <div id="paymentMethodArea" class="space-y-4">
                  <div class="bg-indigo-50 border border-indigo-100 rounded-xl p-4 text-center">
                      <p class="text-xs font-bold text-indigo-800 mb-2 uppercase tracking-wide">สแกนจ่ายด้วย PromptPay</p>
                      <div class="bg-white p-2 rounded-lg inline-block shadow-sm">
                          <img id="qrImage" src="" class="w-40 h-40 object-contain">
                      </div>
                      <p class="text-[10px] text-indigo-400 mt-2">QR Code จะเปลี่ยนตามยอดเงินสุทธิ</p>
                  </div>

                  <div>
                      <label class="block text-sm font-bold text-slate-700 mb-2">แนบหลักฐานการโอนเงิน</label>
                      <input type="file" id="slipFile" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-bold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer">
                  </div>
              </div>
          </div>

          <div class="p-4 border-t bg-slate-50 flex justify-end gap-3">
              <button onclick="document.getElementById('payModal').close()" class="px-5 py-2 text-slate-500 hover:bg-white rounded-lg font-bold text-sm">ยกเลิก</button>
              <button onclick="confirmPayment()" class="px-6 py-2 bg-indigo-600 text-white rounded-lg font-bold shadow-md hover:bg-indigo-700 text-sm transition">ยืนยันการชำระเงิน</button>
          </div>
      </div>
  </dialog>

  <script>
    const API = (location.hostname === "localhost" || location.hostname === "127.0.0.1") 
    ? "http://127.0.0.1:8000" 
    : "https://edtech-api-zigm.onrender.com"; // <-- ใส่ลิงก์ Render ของคุณตรงนี้
    const urlParams = new URLSearchParams(window.location.search);
    const courseId = urlParams.get('id');
    let courseData = {};
    let appliedCoupon = null;

    async function init() {
        if(!courseId) location.href = "./course.html";
        try {
            const res = await fetch(`${API}/courses/${courseId}`);
            if(!res.ok) throw new Error();
            courseData = await res.json();
            
            document.getElementById("courseContent").classList.remove("hidden");
            document.getElementById("loading").classList.add("hidden");
            
            // Basic Info
            document.getElementById("cTitle").textContent = courseData.title;
            document.getElementById("cDesc").innerText = courseData.description || "-";
            document.getElementById("cPrice").textContent = courseData.price > 0 ? `฿${courseData.price.toLocaleString()}` : "FREE";
            document.getElementById("cCategory").textContent = courseData.category;
            document.getElementById("cImage").src = courseData.thumbnail || 'https://placehold.co/600x400';
            
            // Meta
            let lessons = 0, mins = 0;
            courseData.chapters.forEach(ch => { lessons += ch.lessons.length; ch.lessons.forEach(l => mins += l.duration); });
            document.getElementById("cLessonCount").textContent = lessons;
            document.getElementById("cDuration").textContent = mins + " นาที";

            // Extra Info
            if(courseData.highlights) {
                document.getElementById("highlightsArea").classList.remove("hidden");
                document.getElementById("cHighlights").innerText = courseData.highlights;
            }
            if(courseData.target_audience) {
                document.getElementById("targetArea").classList.remove("hidden");
                document.getElementById("cTarget").innerText = courseData.target_audience;
            }

            // Chapters
            document.getElementById("chapterList").innerHTML = courseData.chapters.map((ch, i) => `
                <div class="bg-white p-4 rounded-xl border border-slate-100 flex justify-between items-center hover:shadow-sm transition">
                    <div>
                        <span class="font-bold text-slate-700 block">บทที่ ${i+1}: ${ch.title}</span>
                        <span class="text-xs text-slate-400">${ch.lessons.length} บทเรียน</span>
                    </div>
                    <div class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-400">▶</div>
                </div>
            `).join("");

        } catch { alert("ไม่พบคอร์สเรียน"); location.href="./course.html"; }
    }

    // --- Payment Logic ---
    function openPaymentModal() {
        const token = localStorage.getItem("token");
        if(!token) return location.href = "./login.html";

        if(courseData.price === 0) {
            confirmFreeEnroll();
        } else {
            resetPaymentModal();
            updatePaymentUI(courseData.price);
            document.getElementById("payModal").showModal();
        }
    }

    async function confirmFreeEnroll() {
        const result = await Swal.fire({
            title: 'สมัครเรียนฟรี?',
            text: "คอร์สนี้ไม่มีค่าใช้จ่าย",
            icon: 'question',
            showCancelButton: true,
            confirmButtonText: 'ยืนยัน',
            cancelButtonText: 'ยกเลิก'
        });
        if(result.isConfirmed) {
            await fetch(`${API}/users/me/courses?course_id=${courseId}`, { method: "POST", headers: { Authorization: `Bearer ${localStorage.getItem("token")}` } });
            Swal.fire("สำเร็จ!", "เริ่มเรียนได้เลย", "success").then(() => location.href="./me.html");
        }
    }

    function resetPaymentModal() {
        appliedCoupon = null;
        document.getElementById("couponInput").value = "";
        document.getElementById("slipFile").value = "";
        document.getElementById("payDiscountRow").classList.add("hidden");
    }

    async function applyCoupon() {
        const code = document.getElementById("couponInput").value.trim();
        if(!code) return;

        try {
            const res = await fetch(`${API}/coupons/validate`, {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ code: code })
            });
            
            if(!res.ok) throw new Error((await res.json()).detail);
            
            const coupon = await res.json();
            appliedCoupon = coupon;
            
            // Calculate Discount
            let discount = 0;
            if(coupon.discount_type === "percent") discount = (courseData.price * coupon.discount_value) / 100;
            else discount = coupon.discount_value;
            
            let final = Math.max(0, courseData.price - discount);
            
            // Update UI
            updatePaymentUI(final, discount);
            Swal.fire({ icon: 'success', title: 'ใช้คูปองสำเร็จ', text: `ลดไป ฿${discount.toLocaleString()}`, timer: 1500, showConfirmButton: false, target: document.getElementById('payModal') });

        } catch(e) {
            Swal.fire({ icon: 'error', title: 'ใช้คูปองไม่ได้', text: e.message, target: document.getElementById('payModal') });
            appliedCoupon = null;
            updatePaymentUI(courseData.price);
        }
    }

    function updatePaymentUI(finalPrice, discount=0) {
        document.getElementById("payOriginalPrice").textContent = `฿${courseData.price.toLocaleString()}`;
        document.getElementById("payFinalPrice").textContent = `฿${finalPrice.toLocaleString()}`;
        
        if(appliedCoupon) {
            document.getElementById("payDiscountRow").classList.remove("hidden");
            document.getElementById("couponName").textContent = appliedCoupon.code;
            document.getElementById("payDiscountVal").textContent = `-฿${discount.toLocaleString()}`;
        } else {
            document.getElementById("payDiscountRow").classList.add("hidden");
        }

        // Generate QR
        document.getElementById("qrImage").src = `${API}/payments/qr?amount=${finalPrice}`;
    }

    async function confirmPayment() {
        const file = document.getElementById("slipFile").files[0];
        if(!file) return Swal.fire({ icon: 'warning', title: 'แจ้งเตือน', text: 'กรุณาแนบสลิปโอนเงิน', target: document.getElementById('payModal') });

        const fd = new FormData();
        fd.append("course_id", courseId);
        fd.append("file", file);
        if(appliedCoupon) fd.append("coupon_code", appliedCoupon.code);

        const loading = Swal.fire({ title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => Swal.showLoading(), target: document.getElementById('payModal') });

        try {
            const res = await fetch(`${API}/payments/upload`, {
                method: "POST", headers: { Authorization: `Bearer ${localStorage.getItem("token")}` }, body: fd
            });
            
            if(res.ok) {
                document.getElementById("payModal").close();
                Swal.fire({ icon: 'success', title: 'บันทึกสำเร็จ', text: 'กรุณารอแอดมินตรวจสอบสลิป', confirmButtonText: 'ตกลง' }).then(() => location.href="./me.html");
            } else {
                throw new Error((await res.json()).detail);
            }
        } catch(e) {
            Swal.fire({ icon: 'error', title: 'เกิดข้อผิดพลาด', text: e.message, target: document.getElementById('payModal') });
        }
    }

    init();
  </script>
</body>
</html>
