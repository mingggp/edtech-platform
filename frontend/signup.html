<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>สมัครสมาชิกใหม่ — MingSmileyFace</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; }
    /* Correct CSS for ring effect */
    .glass-input { background: rgba(243, 244, 246, 0.6); backdrop-filter: blur(4px); border: 1px solid #e5e7eb; transition: all 0.2s; }
    .glass-input:focus { background: white; border-color: #6366f1; box-shadow: 0 0 0 2px #e0e7ff; outline: none; }
  </style>
</head>
<body class="h-screen w-full bg-slate-50 flex items-center justify-center p-4">

  <div class="bg-white w-full max-w-5xl h-auto md:h-[600px] rounded-3xl shadow-2xl flex overflow-hidden">
    <div class="hidden md:flex w-5/12 bg-indigo-600 text-white flex-col justify-between p-12 relative overflow-hidden">
      <div class="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&w=800')] bg-cover opacity-20 mix-blend-overlay"></div>
      <div class="relative z-10">
        <h2 class="text-3xl font-bold mb-2">ยินดีต้อนรับ! 👋</h2>
        <p class="text-indigo-100 text-sm">เริ่มต้นการเรียนรู้ที่สนุกและเข้าใจง่ายไปกับเรา</p>
      </div>
      <div class="relative z-10 text-xs text-indigo-200">© 2025 MingSmileyFace</div>
    </div>

    <div class="w-full md:w-7/12 p-8 md:p-12 overflow-y-auto">
      <div class="max-w-md mx-auto">
        <h1 class="text-2xl font-bold text-slate-800 mb-6">สร้างบัญชีใหม่ 🚀</h1>

        <form id="signupForm" class="space-y-4">
          <div class="grid grid-cols-2 gap-4">
            <div><label class="block text-xs font-bold text-slate-500 mb-1 ml-1">ชื่อจริง-นามสกุล</label><input id="full_name" type="text" placeholder="สมชาย ใจดี" class="glass-input w-full rounded-xl px-4 py-2.5 text-sm" required /></div>
            <div><label class="block text-xs font-bold text-slate-500 mb-1 ml-1">ชื่อเล่น</label><input id="nickname" type="text" placeholder="พี่หมิง" class="glass-input w-full rounded-xl px-4 py-2.5 text-sm" required /></div>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-500 mb-1 ml-1">ระดับชั้น</label>
            <select id="grade_level" class="glass-input w-full rounded-xl px-4 py-2.5 text-sm cursor-pointer" required>
              <option value="" disabled selected>-- เลือกชั้นเรียน --</option>
              <option value="M1">ม.1 (#dek74)</option><option value="M2">ม.2 (#dek73)</option><option value="M3">ม.3 (#dek72)</option>
              <option value="M4">ม.4 (#dek71)</option><option value="M5">ม.5 (#dek70)</option><option value="M6">ม.6 (#dek69)</option>
              <option value="OTHER">บุคคลทั่วไป</option>
            </select>
          </div>
          <div><label class="block text-xs font-bold text-slate-500 mb-1 ml-1">อีเมล</label><input id="email" type="email" placeholder="name@example.com" class="glass-input w-full rounded-xl px-4 py-2.5 text-sm" required /></div>
          <div><label class="block text-xs font-bold text-slate-500 mb-1 ml-1">รหัสผ่าน</label><input id="password" type="password" placeholder="•••••••• (8 ตัวขึ้นไป)" class="glass-input w-full rounded-xl px-4 py-2.5 text-sm" required /></div>
          <p id="msg" class="text-xs text-center font-bold text-red-500 h-4"></p>
          <button type="submit" class="w-full py-3 bg-slate-900 hover:bg-indigo-600 text-white rounded-xl font-bold shadow-lg transition-all transform active:scale-95">ลงทะเบียนและเข้าสู่ระบบ</button>
        </form>
        <div class="mt-6 text-center text-sm text-slate-500">มีบัญชีอยู่แล้ว? <a href="./login.html" class="text-indigo-600 font-bold hover:underline">เข้าสู่ระบบ</a></div>
      </div>
    </div>
  </div>

  <script>
    const API = (location.hostname === "localhost" || location.hostname === "127.0.0.1") 
    ? "http://127.0.0.1:8000" 
    : "https://edtech-api-zigm.onrender.com"; // <-- ใส่ลิงก์ Render ของคุณตรงนี้
    document.getElementById("signupForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("msg");
      const btn = e.target.querySelector("button");
      const payload = {
        full_name: document.getElementById("full_name").value.trim(),
        nickname: document.getElementById("nickname").value.trim(),
        grade_level: document.getElementById("grade_level").value,
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value
      };

      if(payload.password.length < 8) { msg.textContent = "รหัสผ่านต้องมีอย่างน้อย 8 ตัวอักษร"; return; }
      btn.disabled = true; btn.textContent = "กำลังสร้างบัญชี..."; msg.textContent = "";

      try {
        const res = await fetch(`${API}/auth/signup`, { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify(payload) });
        if(!res.ok) throw new Error((await res.json()).detail || "สมัครไม่สำเร็จ");
        
        msg.textContent = "สมัครสำเร็จ! กำลังเข้าสู่ระบบ...";
        const loginRes = await fetch(`${API}/auth/login`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email: payload.email, password: payload.password }) });
        const loginData = await loginRes.json();
        
        if(!loginRes.ok) throw new Error("เข้าสู่ระบบอัตโนมัติไม่สำเร็จ");
        localStorage.setItem("token", loginData.access_token);
        
        msg.className = "text-xs text-center font-bold text-emerald-600";
        msg.textContent = "สำเร็จ! กำลังพาไปหน้าหลัก...";
        setTimeout(()=> window.location.href = "./me.html", 1000);
      } catch(err){
        msg.className = "text-xs text-center font-bold text-red-500";
        msg.textContent = err.message;
        btn.disabled = false; btn.textContent = "ลงทะเบียนและเข้าสู่ระบบ";
      }
    });
  </script>
</body>
</html>
